# The course's assignments/pages.yml with its one CHANGE ME line filled in.
#
# Every push runs aurora_waves_web.py on GitHub's machine and publishes whatever
# it wrote into site/ at
#
#     https://eating-yuting.github.io/Aurora-Waves/
#
# site/ is not committed: it is output, and this rebuilds it from the numbers in
# data/ every time. The script carries its own dependency block, so `uv run` needs
# nothing else on the runner. Pages must be switched on once by hand, at
# Settings → Pages → Source: "GitHub Actions".
name: Build the page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the script that writes site/index.html
        run: uv run aurora_waves_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
